services:
  parser-redis:
    image: redis:7-alpine
    container_name: juldyz-parser-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - parser_redis_data:/data

  parser-api:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    container_name: juldyz-parser-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PARSER_CELERY_BROKER_URL: redis://parser-redis:6379/0
      PARSER_CELERY_RESULT_BACKEND: redis://parser-redis:6379/0
    depends_on:
      parser-redis:
        condition: service_healthy
    ports:
      - "8003:8003"
    command: uvicorn services.parser.main:app --host 0.0.0.0 --port 8003
    volumes:
      - ./data:/app/data

  parser-worker:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    container_name: juldyz-parser-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PARSER_CELERY_BROKER_URL: redis://parser-redis:6379/0
      PARSER_CELERY_RESULT_BACKEND: redis://parser-redis:6379/0
    depends_on:
      parser-redis:
        condition: service_healthy
    command: celery -A services.parser.celery_app:celery_app worker --loglevel=info
    volumes:
      - ./data:/app/data

volumes:
  parser_redis_data:
